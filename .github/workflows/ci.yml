name: CI

# Runs the organisation's shared checks and packs every skill the way a
# release would, so a broken header, a dead link or a stale version number
# shows on the push and not only when a release is published.
#
# lint, test, audit and brand come from benethos-hub/.github and follow its
# main, so a change to a shared rule reaches every repository at once. The
# tools of lint and test are locked in uv.lock, their settings live in
# pyproject.toml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes anything back.
permissions:
  contents: read

jobs:
  # uv.lock in step with pyproject.toml, Ruff, the formatting and Mypy.
  lint:
    uses: benethos-hub/.github/.github/workflows/python-lint.yml@main

  # The tests on every supported Python version, the coverage of
  # .github/scripts and the skill scripts on the newest with a floor of 80
  # percent. That run also writes the coverage as a badge for the job
  # coverage-badge.
  test:
    uses: benethos-hub/.github/.github/workflows/python-tests.yml@main
    with:
      badge: true

  # The README's coverage badge shows main, so it is written on a push only.
  # It commits coverage.json to the branch badges, which it creates on its
  # first run. Never a required check, a pull request does not run it.
  coverage-badge:
    if: github.event_name == 'push'
    needs: test
    uses: benethos-hub/.github/.github/workflows/coverage-badge.yml@main
    permissions:
      contents: write

  # No known vulnerability in any version uv.lock pins.
  audit:
    uses: benethos-hub/.github/.github/workflows/python-dependency-audit.yml@main

  package:
    name: Check and pack the skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # skills.py needs the standard library only, so there is nothing to
      # cache. uv provides the Python its header asks for.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check and pack
        run: uv run .github/scripts/skills.py pack "$RUNNER_TEMP/skills"

      - name: List the archives and the index
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/skills/*.zip; do
            echo "== $(basename "$archive")"
            unzip -l "$archive"
          done
          cat "$RUNNER_TEMP/skills/skills.json"

  # assets/brand holds icon.svg and a 512x512 icon.png not older than the SVG.
  brand:
    uses: benethos-hub/.github/.github/workflows/brand.yml@main
