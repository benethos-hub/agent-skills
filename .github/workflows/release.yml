name: Release

# Attaches one ZIP per skill and the index skills.json to a GitHub release
# when it is published. The repository stays the source, the archives are
# build results and are never checked in.
#
# Each skill goes up once, as <skill-name>.zip. The name carries no version,
# so the READMEs have a link that always reaches the newest full release,
# and every release keeps its own copy under its tag:
#   releases/latest/download/<skill-name>.zip
#   releases/download/vX.Y.Z/<skill-name>.zip
# skills.json lists every skill with its header, both links, size and SHA-256.
#
# A release starts from a tag vX.Y.Z on main. The version comes from the
# newest heading in CHANGELOG.md, and its section becomes the release notes:
#   gh release create vX.Y.Z --target main \
#     --notes "$(uv run .github/scripts/skills.py version --notes)"
# Nothing is uploaded unless CI passed on the release commit on main and the
# tag is the version in the changelog.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The organisation's gate: the push of the release commit to main ran
  # ci.yml, and that run succeeded. It waits while the run is still going.
  ci-passed:
    uses: benethos-hub/.github/.github/workflows/python-release-ci-passed.yml@main
    permissions:
      actions: read
      contents: read

  attach:
    name: Attach the skill archives
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload the archives as release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token is for the upload, nothing here pushes.
          persist-credentials: false

      # skills.py needs the standard library only, so there is nothing to
      # cache. uv provides the Python its header asks for.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: The tag is the version in CHANGELOG.md
        run: uv run .github/scripts/skills.py version --tag "$GITHUB_REF_NAME"

      - name: Check and pack
        run: uv run .github/scripts/skills.py pack "$RUNNER_TEMP/skills" --version "${GITHUB_REF_NAME#v}"

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/skills/*.zip "$RUNNER_TEMP/skills/skills.json"
