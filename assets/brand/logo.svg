<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Agent Skills">
  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2457"/>
      <stop offset="0.55" stop-color="#0E1430"/>
      <stop offset="1" stop-color="#06091A"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="0.5" cy="0.26" r="0.66">
      <stop offset="0" stop-color="#7C6BFF" stop-opacity="0.60"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aShell" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.40" stop-color="#E7ECFA"/>
      <stop offset="0.78" stop-color="#C2CDEC"/>
      <stop offset="1" stop-color="#94A3CF"/>
    </linearGradient>
    <linearGradient id="aDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B5BE6"/>
      <stop offset="1" stop-color="#3C2F9E"/>
    </linearGradient>
    <linearGradient id="aVisor" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#17204A"/>
      <stop offset="0.5" stop-color="#0B1030"/>
      <stop offset="1" stop-color="#060A20"/>
    </linearGradient>
    <linearGradient id="aEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BF6FF"/>
      <stop offset="0.5" stop-color="#2ADCF5"/>
      <stop offset="1" stop-color="#1192E8"/>
    </linearGradient>
    <linearGradient id="aGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aEar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9CCB"/>
      <stop offset="1" stop-color="#D7DEF4"/>
    </linearGradient>
    <linearGradient id="aStack1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C6BFF"/>
    </linearGradient>
    <filter id="aSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="aEyeGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="aDrop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#040616" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="aRim" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="aInner" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="aClip">
      <rect x="0" y="0" width="512" height="512" rx="114"/>
    </clipPath>
    <clipPath id="aHead">
      <rect x="134" y="176" width="244" height="196" rx="60"/>
    </clipPath>
  </defs>

  <g clip-path="url(#aClip)">
    <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#aBg)"/>
    <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#aGlow)"/>

    <g opacity="0.16" stroke="#8FB4FF" stroke-width="1.4" fill="none">
      <path d="M-20 148 H110 L150 108 H214"/>
      <path d="M532 150 H402 L362 110 H300"/>
      <path d="M-20 392 H86 L126 432 H196"/>
      <path d="M532 394 H426 L386 434 H316"/>
    </g>
    <g fill="#8FB4FF" opacity="0.5">
      <circle cx="110" cy="148" r="3.4"/>
      <circle cx="402" cy="150" r="3.4"/>
      <circle cx="86" cy="392" r="3.4"/>
      <circle cx="426" cy="394" r="3.4"/>
    </g>

    <ellipse cx="256" cy="402" rx="126" ry="24" fill="#04061A" opacity="0.6" filter="url(#aSoft)"/>

    <g filter="url(#aDrop)">
      <rect x="248" y="112" width="16" height="78" rx="8" fill="url(#aEar)"/>
      <circle cx="256" cy="104" r="23" fill="url(#aEye)" filter="url(#aEyeGlow)"/>
      <circle cx="249" cy="97" r="7" fill="#FFFFFF" opacity="0.85"/>

      <rect x="106" y="240" width="32" height="74" rx="16" fill="url(#aEar)"/>
      <rect x="374" y="240" width="32" height="74" rx="16" fill="url(#aEar)"/>

      <rect x="134" y="190" width="244" height="196" rx="60" fill="url(#aDepth)"/>
      <rect x="134" y="176" width="244" height="196" rx="60" fill="url(#aShell)"/>

      <g clip-path="url(#aHead)">
        <path d="M166 200 h180 a44 44 0 0 1 42 32 q-116 -34 -264 0 a44 44 0 0 1 42 -32 z" fill="url(#aGloss)" opacity="0.75"/>
      </g>

      <rect x="162" y="212" width="188" height="120" rx="46" fill="url(#aVisor)"/>
      <rect x="162" y="212" width="188" height="120" rx="46" fill="none" stroke="#5B6BA8" stroke-opacity="0.45" stroke-width="3"/>

      <g filter="url(#aEyeGlow)">
        <rect x="200" y="246" width="28" height="46" rx="14" fill="url(#aEye)"/>
        <rect x="284" y="246" width="28" height="46" rx="14" fill="url(#aEye)"/>
      </g>
      <rect x="236" y="306" width="40" height="7" rx="3.5" fill="#22D3EE" opacity="0.55"/>
    </g>

    <g>
      <rect x="178" y="394" width="156" height="20" rx="10" fill="url(#aStack1)" opacity="0.92"/>
      <rect x="202" y="422" width="108" height="18" rx="9" fill="url(#aStack1)" opacity="0.48"/>
    </g>

    <g clip-path="url(#aClip)">
      <rect x="0" y="0" width="512" height="512" rx="114" fill="none" stroke="#01030C" stroke-opacity="0.5" stroke-width="26" filter="url(#aInner)"/>
      <rect x="0" y="-7" width="512" height="519" rx="114" fill="none" stroke="#C9D8FF" stroke-opacity="0.24" stroke-width="11" filter="url(#aInner)"/>
    </g>
  </g>

  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="url(#aRim)" stroke-width="6"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="113.6" fill="none" stroke="#03050F" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>
