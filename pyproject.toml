# Tools for the tests of this repository, locked in uv.lock so Dependabot keeps
# them current. Nothing here is a package. The scripts in .github/scripts and
# in the skills use the standard library only and run with uv run as well.

[project]
name = "agent-skills"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import their helpers from tests/support.py.
pythonpath = ["tests"]

[tool.mypy]
strict = true
files = [".github/scripts/skills.py", "skills"]

# The rule set of the Python projects of the organisation.
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "W",    # pycodestyle warnings
]

# What python-tests.yml measures: the script the workflows run and the
# scripts the skills bring.
[tool.coverage.run]
source = [".github/scripts", "skills"]
branch = true
